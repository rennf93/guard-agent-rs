"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - src/agent.rs
          - src/config.rs
          - src/models.rs
          - src/error.rs
          - src/lib.rs
          - src/utils.rs

"area: transport":
  - changed-files:
      - any-glob-to-any-file:
          - src/transport.rs
          - src/signing.rs

"area: persistence":
  - changed-files:
      - any-glob-to-any-file:
          - src/persistence.rs
          - src/circuit_breaker.rs
          - src/install_id.rs

tests:
